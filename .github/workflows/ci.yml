name: CI — KS Atendimento IA

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ks_user
          POSTGRES_PASSWORD: ks_secure_local_dev_password
          POSTGRES_DB: ks_atendimento
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          pip install -r services/scrapegraph/requirements.txt
          pip install ruff mypy pytest-asyncio

      - name: Preparar Arquivo de Ambiente de Teste
        run: cp .env.example .env

      - name: Lint com Ruff
        run: ruff check apps/api

      - name: Typecheck Python e migração baseline
        run: |
          mypy apps/api/src
          alembic -c apps/api/alembic.ini upgrade head --sql > /tmp/ks-migration.sql

      - name: Typecheck e build web
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run build
          npx tsc --noEmit

      - name: Executar suíte e E2E fake
        run: pytest -q tests apps/api/tests apps/worker/tests services/scrapegraph/tests tests/e2e

      - name: Publicar evidências E2E
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence
          path: test-results/e2e/
          if-no-files-found: ignore

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Preparar configuração segura de Compose
        shell: bash
        run: |
          cp .env.example .env
          printf '\nPUBLIC_DOMAIN=ci.invalid\nPOSTGRES_PASSWORD=ci-only-password\n' >> .env
          chmod 600 .env

      - name: Validar Compose essencial
        run: docker compose config --quiet

      - name: Validar profile OpenWA sem iniciar sessão
        run: docker compose --profile openwa config --quiet

      - name: Construir imagens da aplicação
        run: docker compose build api worker scrapegraph web
