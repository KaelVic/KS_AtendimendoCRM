services:
  postgres:
    ports: []
    logging: &ks-json-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  redis:
    ports: []
    logging: *ks-json-logs

  api:
    ports: []
    volumes:
      - app_data:/app/var
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: '["https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}"]'
    logging: *ks-json-logs

  worker:
    logging: *ks-json-logs

  scrapegraph:
    ports: []
    logging: *ks-json-logs

  web:
    ports: []
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    logging: *ks-json-logs

  openwa:
    image: ${OPENWA_IMAGE:-ghcr.io/rmyndharis/openwa:0.23.3@sha256:c00b5b589446ce7dd6177f1b871789284bcfbe3612189ba109465025eb0ad4ec}
    logging: *ks-json-logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:2785/api/health/ready', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.8.4
    container_name: ks_caddy
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - ks-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_data:
  caddy_data:
  caddy_config:
